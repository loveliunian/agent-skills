# =====================================================================
# field_mappings —— 语义比较合同（核心）：没有合同的字段对，不产生结论
#   normalize: trim|number|number_2dp|date_iso|none
#   null_policy: both_null_equal|null_is_diff|legacy_null_expected|current_null_expected
#   tolerance: 数值相对/绝对容差（abs:0.01 形式）
#   dict_map_ref: 双端字典值→标准码映射表引用（dict_maps 段）
#   redact: none|mask|hash —— 报告呈现时脱敏
#   fixture_pair_required: true=该字段依赖双端各自选业务数据，必须配 fixture 才可比较
# =====================================================================
field_mappings:
  - { legacy_field: CS,     target_field: CS,     normalize: number,        tolerance: "abs:0",     null_policy: both_null_equal, fixture_pair_required: true,  note: "磅房带入=勾选行数，双端各选不同数据须 fixture 配对" }
  - { legacy_field: GHZL,   target_field: GHZL,   normalize: number_2dp,    tolerance: "abs:0.01",  null_policy: both_null_equal, fixture_pair_required: true }
  - { legacy_field: ZSJL,   target_field: ZSJL,   normalize: number_2dp,    tolerance: "abs:0.01",  null_policy: both_null_equal, formula_ref: A.2 }
  - { legacy_field: QSF,    target_field: QSF,    normalize: number,        tolerance: "abs:0",     null_policy: both_null_equal }
  - { legacy_field: FYRQ,   target_field: FYRQ,   normalize: date_iso,      tolerance: "exact",     null_policy: both_null_equal }
  - { legacy_field: FZ,     target_field: FZ,     normalize: trim,          tolerance: "exact",     null_policy: both_null_equal, dict_map_ref: DICT_FZ }
  - { legacy_field: KC,     target_field: KC,     normalize: trim,          tolerance: "exact",     null_policy: both_null_equal, dict_map_ref: DICT_KC }
  - { legacy_field: MZ,     target_field: MZ,     normalize: trim,          tolerance: "exact",     null_policy: both_null_equal, dict_map_ref: DICT_MZ_A4 }
  - { legacy_field: PINZ,   target_field: PINZ,   normalize: trim,          tolerance: "exact",     null_policy: both_null_equal, formula_ref: A.4 }
  - { legacy_field: ZJ,     target_field: ZJ,     normalize: number_2dp,    tolerance: "abs:0.01",  null_policy: both_null_equal, formula_ref: A.6 }
  - { legacy_field: ZXDH,   target_field: ZXDH,   normalize: trim,          tolerance: "exact",     null_policy: null_is_diff, redact: mask }

dict_maps:                                     # 字典双端值→标准码（值可后续回填）
