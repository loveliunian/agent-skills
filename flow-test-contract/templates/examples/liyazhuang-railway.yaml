# =====================================================================
# test-contract.yaml —— 流程测试唯一机器可读契约（模板/示例）
# ---------------------------------------------------------------------
# 定位：本文件是「同源生成」的唯一输入——由它同时生成：
#   ① 人工新系统用例骨架（浏览器手工测试用例.md）
#   ② 老系统对比用例骨架（老系统浏览器对比测试用例.md）
#   ③ 可执行 FlowTrace 场景（flowtrace-scenarios/*.yaml）
#   ④ 字段映射与比较规则（compare-rules.yaml / .json，供 field-level-compare.py）
#   ⑤ 最终报告骨架（report-skeleton.md + summary.template.json）
# 生成器：<skill>/templates/gen_from_contract.py（项目部署布局：docs/自动化测试模板/gen_from_contract.py）
#   用法：uv run --with pyyaml python3 gen_from_contract.py \
#           --contract docs/<流程>/自动化测试/test-contract.yaml \
#           --outdir docs/<流程>/自动化测试/生成件
# 证据链：契约 + run-manifest.json（每次执行落账）→ conclude.py → PASS/FAIL/BLOCKED
#
# 硬性规范：
#   - 凭据禁止明文：accounts 一律 env 引用（CURRENT_<ID>_PWD），报告/截图脱敏
#   - 字段比较必须有语义合同（field_mappings），裸"相同/不同"不构成结论
#   - 双端各自选业务数据时必须登记 fixture_pair_id + 归一化规则
#   - 结论只有三种：PASS（P0/P1=0 且必测项全完成）/ FAIL（存在未豁免语义差异）
#     / BLOCKED（环境/数据/发布前置不足）——由 conclude.py 判定，人工不得越过
# =====================================================================

