gates:                                         # 前置门禁（任一 P0/P1 失败 → BLOCKED）
  # evidence_schema（第十三轮审计强制）：无自动检查器的 gate 必须声明"什么样的证据能证明它"——
  #   kind=report：报告文件（json）须过 required_fields 断言（path/op: eq|contains|regex|gte|lte/value）
  #                + flow_field 绑定契约 flow_code + sha256 现场复算
  #   kind=http：证据 URL 必须命中 allowed_urls 白名单（scheme/host/port/path 边界）且现场探活 200
  # 报告 artifact 由人工检查或检查命令生成（生成器说明见 ~/.agents/skills/flow-test-contract/references/execution-gate.md）
  - id: GATE-DEPLOY
    check: "流程已在新引擎部署且发起人可发起列表可见"
    severity: P1
    on_fail: BLOCKED
    evidence_schema: {kind: report, file_format: json,
                      flow_field: data.flow_code,
                      required_fields: [{path: data.deploy_status, op: eq, value: DEPLOYED},
                                        {path: data.launchable, op: eq, value: true}]}
  - id: GATE-HEALTH
    check: "三服务 health=200"
    severity: P0
    on_fail: BLOCKED
    # GATE-HEALTH 为自动门禁：pipeline 按 environments.health_checks 执行，不需 evidence_schema
  - id: GATE-ACCOUNT
    check: "全部办理账号可登录（.env 引用）"
    severity: P0
    on_fail: BLOCKED
    evidence_schema: {kind: report, file_format: json,
                      required_fields: [{path: data.all_accounts_login, op: eq, value: true},
                                        {path: data.failed_accounts_count, op: eq, value: 0}]}
  - id: GATE-DATA
    check: "磅房未使用≥4组 / 95306 未使用≥3行(含攀钢收货人)"
    severity: P1
    on_fail: BLOCKED
    evidence_schema: {kind: report, file_format: json,
                      required_fields: [{path: data.scale_free_groups, op: gte, value: 4},
                                        {path: data.rail_free_rows, op: gte, value: 3},
                                        {path: data.rail_free_rows_include_pangang, op: eq, value: true}]}
  - id: GATE-CANVAS
    check: "4 张表单画布控件渲染正常"
    severity: P0
    on_fail: BLOCKED
    evidence_schema: {kind: report, file_format: json,
                      flow_field: data.flow_code,
                      required_fields: [{path: data.canvas_render_ok, op: eq, value: true},
                                        {path: data.forms_checked, op: gte, value: 4}]}

exemptions: []                                 # 豁免（须审批记录）：{id, scope, reason, approved_by}

conclusions:                                   # 结论 Gate（conclude.py 执行，人工不得越过）
  PASS:   "gates 全过 且 required 用例全部执行 且 未豁免语义差异=0"
  FAIL:   "存在未豁免语义差异（field_mappings/formulas/routing/buttons/resources/post_flow 任一）"
  BLOCKED: "任一 gate 失败 / 必测数据不可用 / 证据缺失（如字段采集为空）"

report:
  summary_fields: [run_id, conclusion, p0_count, p1_count, required_cases_done, semantic_diffs, exempted_diffs, evidence_paths]
  aux_evidence: "像素 diff（dual-run-diff.js）仅辅助证据，不进入结论"
